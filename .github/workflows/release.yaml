name: Build ZIP & Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          cd "${GITHUB_WORKSPACE}/custom_components/smart_thermostat"
          zip -r "${GITHUB_WORKSPACE}/smart_thermostat.zip" . \
            -x "**/__pycache__/*" \
            -x "**/*.pyc"

      - name: Create Release & Upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: smart_thermostat.zip
          body_path: RELEASE_NOTES.md
          draft: false
          # иначе при повторном пуше того же тега body остаётся от первого релиза
          make_latest: true

      - name: Force-update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release edit "$tag" --notes-file RELEASE_NOTES.md --latest
